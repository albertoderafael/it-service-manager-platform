spring.application.name=it-service-manager

# PostgreSQL
# Toda la configuración de entorno llega por variables. Los valores por defecto
# sirven para desarrollo local contra el contenedor publicado en el puerto 5433.
# La contraseña no tiene valor por defecto: DB_PASSWORD es obligatoria.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/it_service_manager}
spring.datasource.username=${DB_USERNAME:itmanager}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Catálogo de aplicaciones (dentro de Docker: http://application-catalog-service:8081)
application-catalog.base-url=${APPLICATION_CATALOG_BASE_URL:http://localhost:8081}

# Actuator: solo se expone el estado de salud (usado por Docker Compose).
# /actuator/health incluye la conexión a PostgreSQL; /health/liveness y
# /health/readiness indican si el proceso vive y si está listo para recibir tráfico.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
