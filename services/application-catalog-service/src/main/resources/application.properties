spring.application.name=application-catalog-service

server.port=${SERVER_PORT:8081}

# PostgreSQL
# Toda la configuración de entorno llega por variables. Los valores por defecto
# sirven para desarrollo local contra el contenedor publicado en el puerto 5433.
# La contraseña no tiene valor por defecto: DB_PASSWORD es obligatoria
# (se admite también el nombre anterior, APPLICATION_DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/application_db}
spring.datasource.username=${DB_USERNAME:application_user}
spring.datasource.password=${DB_PASSWORD:${APPLICATION_DB_PASSWORD}}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway
spring.flyway.enabled=true

# Actuator: solo se expone el estado de salud (usado por Docker Compose).
# /actuator/health incluye la conexión a PostgreSQL; /health/liveness y
# /health/readiness indican si el proceso vive y si está listo para recibir tráfico.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
