# nginx dentro de Docker Compose:
#   - sirve la SPA (dist/) con fallback a index.html para las rutas de React Router;
#   - reenvía /api/demands y /api/applications a cada microservicio.
# El navegador ve un único origen, así que no hace falta CORS.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Resolver los nombres en cada petición (variables)
    # permite que nginx arranque aunque un servicio todavía no exista o esté parado:
    # en ese caso esa ruta responde 502 y el resto sigue funcionando.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $demand_service  http://demand-service:8080;
    set $catalog_service http://application-catalog-service:8081;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    15s;

    location /api/demands {
        proxy_pass $demand_service;
    }

    location /api/applications {
        proxy_pass $catalog_service;
    }

    # Ficheros con hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta es de la SPA.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
